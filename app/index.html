<!DOCTYPE html>
<html lang='en'>
<head>
    
    <meta charset='utf-8'>
    <meta name='viewport' content='width=device-width, initial-scale=1'>
    <title>Page Title</title>
    <link rel='stylesheet' href='main.css'>
</head>
<body>
    <h1>Uptime Monitor Lite</h1>
    <input id="urlInput" type="url" placeholder="https://example.com">
    <button id="checkButton">Check</button>
    <p id="status">Status: not checked</p>
</body>
    <script>
        const statusText = document.getElementById("status");
        const checkButton = document.getElementById("checkButton");
        const urlInput = document.getElementById("urlInput");
        checkButton.addEventListener("click", () => 
            {const url = urlInput.value;
            if (url === "") {
                statusText.textContent = "Status enter the URL";
                return;
            }
            fetch(`http://localhost:3000?url=${encodeURIComponent(url)}`)
                .then(response => response.text())
                .then(data => {
                    statusText.textContent = data;
                });
            statusText.textContent = "Status: checking..."});
        
        
    </script>
</html>
